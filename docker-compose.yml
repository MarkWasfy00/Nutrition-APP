services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nutrition
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nutrition"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply migrations and seed (seed is upsert-only, safe to rerun)
  migrate:
    build: .
    image: nutrition-app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nutrition
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    depends_on:
      db:
        condition: service_healthy

  app:
    image: nutrition-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nutrition
      AUTH_TRUST_HOST: "true"
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Daily scheduled jobs (see README "Scheduled jobs")
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 86400
          curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/checkin-reminders
          curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/renew-subscriptions
        done
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
